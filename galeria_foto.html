<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos</title>
    <link rel="stylesheet" href="galeria_fotos.css">
</head>
<body>
    <h1>Galeria de Fotos</h1>
    
    <div class="pai">

        <div class="linha">
            <div class="foto">
                <img class="img" src="https://picsum.photos/id/237/300/200" alt="foto de um cachorro">
                <p>doguinho</p>
            </div>

            <div class="foto">
                <img class="img" src="https://picsum.photos/id/238/300/200" alt="foto de uma cidade">
                <p>cidade</p>
            </div>

            <div class="foto">
                <img class="img" src="https://picsum.photos/id/239/300/200" alt="foto d um dente-de-leão">
                <p>dente-de-leão</p>
            </div>
        </div>

        <div class="linha">
            <div class="foto">
                <img class="img" src="https://picsum.photos/id/240/300/200" alt="foto de uma escada com uma pessoa e um cachorro">
                <p>escada</p>
            </div>

            <div class="foto">
                <img class="img" src="https://picsum.photos/id/241/300/200" alt="foto de uma trilha em um morro">
                <p>trilha no morro</p>
            </div>

            <div class="foto">
                <img class="img" src="https://picsum.photos/id/242/300/200" alt=" foto de um trilho de trem em um cidade">
                <p>trilho de trem</p>
            </div>
        </div>

        <div class="linha">
            <div class="foto">
                <img class="img" src="https://picsum.photos/id/243/300/200" alt="foto de uma trilha em uma floresta">
                <p>trilha na floresta</p>
            </div>

            <div class="foto">
                <img class="img" src="https://picsum.photos/id/244/300/200" alt="foto de passaros em um cais">
                <p>passaros em um cais</p>
            </div>

            <div class="foto">
                <img class="img" src="https://picsum.photos/id/248/300/200" alt="foto de um cacto">
                <p>cacto</p>
            </div>
        </div>
    </div>
</body>
</html>
